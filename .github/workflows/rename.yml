name: Rename Patchs -> Patches

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch to modify'
        required: true
        default: 'AGNi_haydn_MIUI_ST'
      pr_branch_name:
        description: 'Branch name to push changes to (if creating PR)'
        required: true
        default: 'rename-patchs-to-patches'
      commit_message:
        description: 'Commit message'
        required: true
        default: 'Rename Patchs -> Patches'
      create_pr:
        description: 'Create a Pull Request? (true/false)'
        required: true
        default: 'true'

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Show repo root for debugging
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Rename Patchs -> Patches (git mv for each occurrence)
        env:
          PR_BRANCH: ${{ inputs.pr_branch_name }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          CREATE_PR: ${{ inputs.create_pr }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$PR_BRANCH"

          FOUND=0
          while IFS= read -r -d '' dir; do
            FOUND=1
            base=$(dirname "$dir")
            newdir="$base/Patches"
            echo "Renaming '$dir' -> '$newdir'"
            if git mv "$dir" "$newdir"; then
              echo "git mv succeeded for $dir"
            else
              echo "git mv failed for $dir, trying fallback"
              mv "$dir" "$newdir"
              git add -A
            fi
          done < <(find . -type d -name 'Patchs' -print0)

          if [ "$FOUND" -eq 0 ]; then
            echo "No directory named 'Patchs' found. Nothing to do."
            exit 0
          fi

          git add -A
          git commit -m "$COMMIT_MESSAGE" || echo "No changes to commit."

          if [ "$CREATE_PR" = "true" ]; then
            git push --set-upstream origin "$PR_BRANCH"
          else
            git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Create Pull Request (if requested)
        if: ${{ inputs.create_pr == 'true' }}
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.pr_branch_name }}
          base: ${{ inputs.target_branch }}
          title: Rename Patchs -> Patches
          body: Automated rename of Patchs directories to Patches
          commit-message: ${{ inputs.commit_message }}
